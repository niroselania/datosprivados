<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Archivo IT · Ingresar</title>
<script>(()=>{const t=localStorage.getItem('aitTheme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
<style>
:root{--bg:#f3f5f1;--paper:#fff;--ink:#1d2620;--muted:#738077;--line:#e3e8e1;--field:#fafbf9;--green:#22694c;--green2:#2f8a63;--ring:0 0 0 3px #22694c26;--err:#ad3a2f}
[data-theme=dark]{--bg:#0f1512;--paper:#161e1a;--ink:#e6ece8;--muted:#8d9a92;--line:#27322c;--field:#1b2420;--green:#4fbf8b;--green2:#6fd3a3;--ring:0 0 0 3px #4fbf8b33;--err:#ff8f86}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background-attachment:fixed!important;display:grid;place-items:center;background:radial-gradient(1200px 600px at 10% -10%,#22694c22,transparent),radial-gradient(900px 500px at 110% 110%,#2f8a6322,transparent),var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.card{width:min(420px,calc(100% - 32px));padding:34px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px #1d262018;}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}.logo{height:46px;width:46px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--green),var(--green2));border-radius:14px;font-weight:800;box-shadow:0 6px 18px #22694c40}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}.brand h1{font-size:23px;margin:2px 0 0;letter-spacing:-.03em}
.card h2{font-size:20px;margin:0 0 5px}.card p{color:var(--muted);margin:0 0 20px;font-size:14px}
label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}.field{position:relative}
input{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font:inherit;color:inherit;background:var(--field);outline:none;transition:border-color .15s,box-shadow .15s}input:focus{border-color:var(--green);box-shadow:var(--ring)}
.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:650;padding:6px 8px;border-radius:7px;cursor:pointer}.toggle:hover{color:var(--green)}
.caps{font-size:12px;color:#b07a00;margin-top:6px}
button.go{width:100%;padding:13px;border:0;border-radius:11px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:22px;transition:transform .12s}[data-theme=dark] button.go{color:#0d1a13}button.go:hover{transform:translateY(-1px)}button.go:disabled{opacity:.65;transform:none}
#msg{min-height:20px;color:var(--err);font-size:13px;margin-top:10px}.private{font-size:12px;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-top:8px}.hidden{display:none}
</style></head><body><main class="card"><div class="brand"><div class="logo">IT</div><div><div class="eyebrow">Biblioteca privada</div><h1>Archivo IT</h1></div></div><h2>Iniciá sesión</h2><p>Ingresá con el usuario y la contraseña configurados en Portainer.</p><form id="form"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Contraseña</label><div class="field"><input id="password" name="password" type="password" autocomplete="current-password" required style="padding-right:74px"><button type="button" class="toggle" id="toggle" aria-label="Mostrar contraseña">Mostrar</button></div><div id="caps" class="caps hidden">⇪ Bloq Mayús está activado</div><button class="go" type="submit">Ingresar</button><div id="msg" role="status"></div></form><div class="private">🔒 Acceso privado. Mantené el sitio detrás de HTTPS y compartilo solo por VPN o una red confiable.</div></main><script>
const pw=document.querySelector('#password');document.querySelector('#toggle').onclick=e=>{const show=pw.type==='password';pw.type=show?'text':'password';e.target.textContent=show?'Ocultar':'Mostrar';pw.focus()};
pw.addEventListener('keyup',e=>document.querySelector('#caps').classList.toggle('hidden',!(e.getModifierState&&e.getModifierState('CapsLock'))));
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();let b=e.target.querySelector('button.go'),msg=document.querySelector('#msg');b.disabled=true;b.textContent='Verificando…';msg.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:e.target.username.value,password:e.target.password.value})});let d=await r.json().catch(()=>({}));if(r.status===429)throw Error('Demasiados intentos. Esperá unos minutos y volvé a probar.');if(!r.ok)throw Error(d.error||'No se pudo ingresar.');location.href='/'+location.search}catch(err){msg.textContent=err.message;pw.select()}finally{b.disabled=false;b.textContent='Ingresar'}});
</script></body></html>
