<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivo IT · Ingresar</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f2;color:#202923;font:15px/1.45 "Segoe UI",Arial,sans-serif}.card{width:min(420px,calc(100% - 32px));padding:32px;background:white;border:1px solid #e5e9e3;border-radius:22px;box-shadow:0 20px 60px #24332812}.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}.logo{height:44px;width:44px;display:grid;place-items:center;color:white;background:#245d46;border-radius:14px;font-weight:700}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#778078;font-weight:700}.brand h1{font-size:23px;margin:2px 0 0;letter-spacing:-.03em}.card h2{font-size:20px;margin:0 0 5px}.card p{color:#778078;margin:0 0 22px;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #dfe5de;border-radius:10px;font:inherit;outline:none}input:focus{border-color:#80a58d;box-shadow:0 0 0 3px #245d4610}button{width:100%;padding:12px;border:0;border-radius:10px;background:#245d46;color:white;font:inherit;font-weight:700;cursor:pointer;margin-top:20px}#msg{min-height:20px;color:#ad4338;font-size:13px;margin-top:10px}.private{font-size:12px;color:#768078;background:#f5f7f4;border-radius:10px;padding:11px;margin-top:10px}
</style></head><body><main class="card"><div class="brand"><div class="logo">IT</div><div><div class="eyebrow">Biblioteca privada</div><h1>Archivo IT</h1></div></div><h2>Iniciá sesión</h2><p>Ingresá con el usuario y la contraseña configurados en Portainer.</p><form id="form"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Ingresar</button><div id="msg" role="status"></div></form><div class="private">Acceso privado. Mantené el sitio detrás de HTTPS y compartilo solo por VPN o una red confiable.</div></main><script>
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();let b=e.target.querySelector('button'),msg=document.querySelector('#msg');b.disabled=true;b.textContent='Verificando…';msg.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:e.target.username.value,password:e.target.password.value})});let d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo ingresar.');location.href='/'}catch(err){msg.textContent=err.message}finally{b.disabled=false;b.textContent='Ingresar'}});
</script></body></html>
