services:
  archivo-it:
    build: .
    container_name: archivo-it
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:3000"
    env_file:
      - stack.env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      MAX_UPLOAD_MB: "100"
    volumes:
      - archivo_it_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  archivo_it_data:
    name: archivo_it_data
